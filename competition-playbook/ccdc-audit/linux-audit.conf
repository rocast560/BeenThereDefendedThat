# =============================================================================
# linux-audit.conf  —  configuration for linux-audit.sh
# =============================================================================
# This file is sourced as bash. Edit values to match YOUR competition box.
# Anything you leave blank/empty falls back to a sane default in the script.
# Arrays use bash syntax:  NAME=(item1 item2 item3)
# =============================================================================

# --- Identity / scoring ------------------------------------------------------
# Scored service ports on THIS host (kept OPEN by port — the scorer's IP rotates).
SCORED_PORTS=(80 443)

# Ports that are legitimately allowed to LISTEN on this host (scored + needed).
# Anything listening that is NOT in this list is flagged.
ALLOWED_LISTEN_PORTS=(22 80 443)

# Your team's admin/jump-box subnet. Admin ports (SSH) should be reachable
# ONLY from here. Used to sanity-check firewall scoping. CIDR or blank.
ADMIN_SUBNET="10.0.99.0/24"

# Documented scoring source range, IF your packet gives one. Blank = scorer
# rotates freely, so scored ports must be open to all (this is expected).
SCORING_CIDR=""

# --- Accounts ----------------------------------------------------------------
# Accounts you EXPECT to have a login shell. Extra ones get flagged.
EXPECTED_SHELL_USERS=(root)

# Accounts you EXPECT to have sudo/root-equivalent. Extra ones get flagged.
EXPECTED_ADMINS=(root)

# Accounts that are legitimately allowed to be UID 0. Only root normally.
KNOWN_UID0=(root)

# Users to ignore entirely in some checks (service accounts you trust).
EXCLUDE_USERS=(root)

# Supplementary groups whose members are effectively root (privesc-equivalent).
# Any member NOT in EXCLUDE_USERS is flagged. docker/lxd = trivial root.
DANGEROUS_GROUPS=(docker lxd lxc disk shadow)

# Processes legitimately allowed to hold a raw/AF_PACKET (sniffer) socket.
# ANY other process sniffing raw packets is a BPFdoor/watershell-class backdoor.
ALLOWED_SNIFFERS=(dhclient dhcpcd tcpdump wireshark dumpcap tshark NetworkManager systemd-networkd wpa_supplicant avahi-daemon arping)

# Cap for the hidden-PID decloak brute-force (check_hidden_proc). pid_max can be
# 4M; scanning all of it in bash is slow. Raise for full coverage on a quiet box.
HIDDEN_PID_SCAN_MAX=65536

# --- Web ---------------------------------------------------------------------
# Web roots to scan for recently-modified files (webshell indicator).
WEB_ROOTS=(/var/www /var/www/html /usr/share/nginx/html /srv/www)

# Flag web files modified within this many days (attackers drop shells).
WEB_MODIFIED_DAYS=2

# --- Thresholds --------------------------------------------------------------
# Flag files modified in system dirs within this many minutes (fresh tampering).
SYSDIR_MODIFIED_MINUTES=1440

# --- Check toggles (1 = run, 0 = skip) --------------------------------------
CHECK_UID0=1            # extra UID-0 accounts (backdoor)
CHECK_EMPTY_PASSWD=1    # accounts with empty password hashes
CHECK_SHELL_USERS=1     # unexpected login shells
CHECK_ADMINS=1          # unexpected sudo/root grants + NOPASSWD
CHECK_SSH=1             # sshd_config hardening (root login, empty pw, etc.)
CHECK_AUTHKEYS=1        # unexpected SSH authorized_keys (persistence)
CHECK_LISTENERS=1       # listening ports vs allowlist
CHECK_OUTBOUND=1        # established outbound to public IPs (possible C2)
CHECK_CRON=1            # cron jobs + systemd timers
CHECK_SERVICES=1        # unexpected enabled/running services
CHECK_SUID=1            # SUID/SGID binaries (vs baseline if present)
CHECK_WORLD_WRITABLE=1  # world-writable files in sensitive paths
CHECK_FIREWALL=1        # ufw/iptables default-deny + scored-port posture
CHECK_PERSISTENCE=1     # ld.so.preload, rc.local, shell rc backdoors
CHECK_WEB=1             # recently modified web files
CHECK_SESSIONS=1        # current logins + recent auth failures
CHECK_PASSWD_INTEGRITY=1 # passwd/shadow/sudoers mtime vs competition start
CHECK_CAPABILITIES=1    # getcap dangerous file capabilities (cap_setuid, etc.)
CHECK_NFS=1             # /etc/exports no_root_squash (remote-root SUID drop)
CHECK_DANGER_GROUPS=1   # docker/lxd/disk/shadow membership (root-equivalent)
CHECK_KERNEL=1          # kernel version vs Dirty Pipe / Dirty COW ranges
CHECK_SUDO_VERSION=1    # sudo version vs CVE-2019-14287 / CVE-2021-3156
CHECK_SUDO_ENV=1        # sudoers env_keep LD_PRELOAD / SETENV injection
CHECK_SYSTEMD_WRITABLE=1 # writable systemd units + ExecStart binaries
CHECK_ACL=1             # extra ACLs / symlinks on passwd & shadow
CHECK_SSH_CA=1          # SSH TrustedUserCAKeys + cert-authority keys
# --- advanced implant hunt (custom / pre-planted / fileless C2) --------------
CHECK_RAWSOCK=1         # AF_PACKET sniffer sockets + promisc (BPFdoor/watershell)
CHECK_MEMEXEC=1         # deleted-exe / memfd / RWX memory (fileless & injected)
CHECK_PRELOAD_HOOK=1    # LD_PRELOAD in live process environments (userland hook)
CHECK_EBPF=1            # loaded eBPF/XDP/TC programs (kernel backdoor surface)
CHECK_HIDDEN_PROC=1     # hidden PIDs (LKM rootkit decloak) + kernel taint
CHECK_NAT_REDIRECT=1    # NAT PREROUTING REDIRECT/DNAT (port-piggyback C2)
CHECK_PTRACE=1          # live ptrace relationships + yama ptrace_scope
CHECK_EXEC_HARDENING=1  # noexec on tmp dirs + fapolicyd execution control
CHECK_SYSTEMD_SANDBOX=1 # sandboxing posture of network daemons

# --- Baseline (optional) -----------------------------------------------------
# Directory where snapshots are stored for --snapshot / diff mode.
BASELINE_DIR="./baseline"
