# btdt-edr.conf — Linux sensor configuration (sourced as bash by btdt-edr.sh)
#
# Everything here is an allowlist or a toggle. The first run on a given host
# WILL be noisy — that is by design. Watch the ALERT lines, decide which are
# your own legitimate software, add them here, re-run. Ten minutes of tuning
# per host role buys you near-zero-false-positive detection for the round.

# ---------------------------------------------------------------------------
# Response posture
# ---------------------------------------------------------------------------
# observe    = detect and log only. NOTHING is changed on the host. (default)
# quarantine = observe + move dropped implant binaries aside + sever the C2
#              socket. Does not kill processes or touch accounts.
# kill       = quarantine + kill the offending process tree + lock the account
#              + re-enable a tampered firewall from the saved baseline.
#
# Auto-response fires ONLY on detections tagged high-confidence (near-zero FP:
# raw AF_PACKET shell, memfd/deleted exec, reverse-shell stdio, hidden PID).
# Everything else always only alerts, whatever the mode. Override per-run with
# --respond MODE.
RESPOND_MODE="observe"

# ---------------------------------------------------------------------------
# Fail-open safety — CCDC scoring engine rotates its source IPs on purpose.
# NEVER let a response drop inbound on a scored service port. The sensor only
# ever acts on the egress/process side; these ports are additionally hard-
# fenced so no sever/kill touches a flow serving them.
# ---------------------------------------------------------------------------
SCORED_PORTS="22 25 53 80 110 143 443 3306 3389"

# ---------------------------------------------------------------------------
# Allowlists
# ---------------------------------------------------------------------------
# Processes legitimately allowed to hold a raw AF_PACKET socket / sniff.
ALLOWED_SNIFFERS="dhclient dhcpcd tcpdump wireshark dumpcap tshark NetworkManager systemd-network wpa_supplicant avahi-daemon arping ntpd chronyd"

# Processes that legitimately map RWX anonymous memory (JIT engines). These are
# excluded from the reflective-code check.
ALLOWED_JIT="java node nodejs mysqld mariadbd mono dotnet python3 firefox chrome chromium.br"

# Listening ports you EXPECT on this host. Anything else listening is flagged.
# Tune per role (web box vs DB box vs DC-equivalent).
ALLOWED_LISTEN_PORTS="22 25 53 80 110 143 443 465 587 993 995 3306 5432"

# Your internal DNS resolver(s). Outbound :53 to anything else is suspicious.
INTERNAL_RESOLVERS=""   # e.g. "10.0.0.53 10.0.0.54"

# Interpreters / LOLBins that should essentially never hold an outbound socket.
LOLBIN_EGRESS="nc ncat socat perl python python3 ruby php bash sh dash zsh lua tclsh"

# Extra RFC1918-ish ranges to treat as internal (never counted as "public"
# egress). Loopback, RFC1918, link-local and ULA are always internal.
INTERNAL_EXTRA_CIDRS=""

# ---------------------------------------------------------------------------
# State / output
# ---------------------------------------------------------------------------
BASELINE_DIR="/var/lib/btdt-edr"       # baseline + alert log live here
ALERT_LOG="${BASELINE_DIR}/alerts.jsonl"
WATCH_INTERVAL=30                      # seconds between sweeps in --watch mode

# ---------------------------------------------------------------------------
# Per-detection toggles (1 = on, 0 = off)
# ---------------------------------------------------------------------------
DET_RAWSOCK=1          # AF_PACKET sniff-shell (watershell / BPFdoor class)
DET_MEMEXEC=1          # memfd/deleted exec + RWX anonymous memory
DET_REVSHELL=1         # shell with a socket on stdin/stdout/stderr
DET_WRITABLE_EXEC=1    # process running from /tmp, /dev/shm, /var/tmp
DET_EGRESS=1           # outbound by unexpected/temp-path binary (IP-rotation-proof)
DET_LOLBIN_EGRESS=1    # interpreter/LOLBin holding an outbound socket
DET_HIDDEN_PROC=1      # hidden-PID rootkit decloak + kernel taint
DET_PRELOAD=1          # LD_PRELOAD userland hooks
DET_NAT_REDIRECT=1     # PREROUTING REDIRECT/DNAT port-piggyback
DET_PERSISTENCE=1      # cron/systemd/ssh-key/preload diff vs T0 baseline
DET_LISTENERS=1        # unexpected listening ports
DET_EBPF=1             # loaded eBPF/XDP/TC enumeration vs baseline (advisory)
DET_FIREWALL=1         # egress firewall tampered / flushed
